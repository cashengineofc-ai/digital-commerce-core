name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit

  payment-edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno type-check Pix payment functions
        run: |
          deno check supabase/functions/_shared/pix-brcode.ts
          deno check supabase/functions/mercadopago-checkout/index.ts
          deno check supabase/functions/mercadopago-payment-status/index.ts
          deno check supabase/functions/mercadopago-webhook/index.ts
