name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit

  payment-edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check shared Pix BR Code helper
        run: deno check --node-modules-dir=auto supabase/functions/_shared/pix-brcode.ts
      - name: Check Mercado Pago checkout
        id: checkout_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          deno check --node-modules-dir=auto supabase/functions/mercadopago-checkout/index.ts 2>&1 | tee checkout-deno-check.log
      - name: Upload checkout Deno diagnostics
        if: steps.checkout_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: checkout-deno-check
          path: checkout-deno-check.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail if checkout check failed
        if: steps.checkout_check.outcome == 'failure'
        run: exit 1
      - name: Check Mercado Pago payment status
        run: deno check --node-modules-dir=auto supabase/functions/mercadopago-payment-status/index.ts
      - name: Check Mercado Pago webhook
        run: deno check --node-modules-dir=auto supabase/functions/mercadopago-webhook/index.ts
